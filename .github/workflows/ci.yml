name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stage order is locked (see docs/standards/testing.md):
# lint -> type check -> tests -> build -> Playwright -> coverage -> security checks.
# One job, ordered steps -> the order above is guaranteed by construction.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cdis
          MYSQL_USER: cdis
          MYSQL_PASSWORD: cdis_dev_password
          MYSQL_ROOT_PASSWORD: cdis_root_dev_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pcdis_root_dev_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back-end/package-lock.json
            front-end/package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      # generated/ is gitignored (it's a build artifact, not source) —
      # a fresh checkout has no Prisma Client until this runs. Needed
      # before type-check, tests, and the seed step below all import it.
      - name: Generate Prisma Client
        working-directory: back-end
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      # CI-only values, matching the *.env.example files. Not secrets —
      # the same test-only JWT secret already lives in
      # back-end/vitest.config.ts for the unit-test suite; the whole
      # database is thrown away at the end of the job either way.
      - name: Write backend .env
        working-directory: back-end
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=4000
          CORS_ORIGIN=http://localhost:5173
          DATABASE_URL=mysql://cdis:cdis_dev_password@localhost:3308/cdis
          JWT_ACCESS_SECRET=ci-only-secret-never-used-outside-github-actions
          JWT_ACCESS_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN_DAYS=7
          BCRYPT_SALT_ROUNDS=4
          ACCOUNT_LOCKOUT_MAX_ATTEMPTS=5
          ACCOUNT_LOCKOUT_DURATION_MINUTES=15
          EOF

      - name: Write frontend .env
        working-directory: front-end
        run: |
          cat > .env <<'EOF'
          VITE_APP_NAME=CDIS
          VITE_APP_ENV=production
          VITE_API_BASE_URL=http://localhost:4000/api/v1
          EOF

      # Sets up both databases this job needs: `cdis` (the dev DB, used
      # by Playwright/E2E further down) and `cdis_test` (the backend's
      # integration tests, e.g. auth.integration.test.ts's admin-role
      # flow, look up seeded roles directly — both need migrating AND
      # seeding, not just migrating.
      # MySQL's official image only grants MYSQL_USER privileges on
      # MYSQL_DATABASE ("cdis") — a database created afterward
      # (cdis_test) needs its own explicit GRANT, or the `cdis` user
      # gets P1010 "access denied" the moment anything touches it.
      - name: Prepare databases
        working-directory: back-end
        run: |
          mysql -h127.0.0.1 -P3308 -uroot -pcdis_root_dev_password -e "CREATE DATABASE IF NOT EXISTS cdis_test; GRANT ALL PRIVILEGES ON cdis_test.* TO 'cdis'@'%'; FLUSH PRIVILEGES;"
          npx prisma migrate deploy
          npx prisma db seed
          DATABASE_URL="mysql://cdis:cdis_dev_password@localhost:3308/cdis_test" npx prisma migrate deploy
          DATABASE_URL="mysql://cdis:cdis_dev_password@localhost:3308/cdis_test" npx prisma db seed

      # ---- lint ----
      - name: Lint backend
        working-directory: back-end
        run: npm run lint

      - name: Lint frontend
        working-directory: front-end
        run: npm run lint

      # ---- type check ----
      - name: Type-check backend
        working-directory: back-end
        run: npm run build # back-end's "build" script *is* `tsc --noEmit` — see docs/standards/deployment.md

      - name: Type-check frontend
        working-directory: front-end
        run: npx tsc -b

      # ---- tests ----
      - name: Backend tests (unit + integration)
        working-directory: back-end
        run: npm run test:all

      - name: Frontend tests
        working-directory: front-end
        run: npm run test

      # ---- build ----
      - name: Build frontend
        working-directory: front-end
        run: npm run build

      # ---- Playwright (E2E) ----
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ---- coverage ----
      # Re-runs with coverage instrumentation so a coverage-threshold
      # failure shows up as its own distinct, clearly-labeled stage
      # rather than being folded into the "tests" result above.
      - name: Backend coverage
        working-directory: back-end
        run: npm run test:coverage

      - name: Frontend coverage
        working-directory: front-end
        run: npm run test:coverage

      # ---- security checks ----
      - name: Audit backend dependencies
        working-directory: back-end
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: front-end
        run: npm audit --audit-level=high
