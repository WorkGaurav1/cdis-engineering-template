name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stage order is locked (see docs/standards/testing.md):
# lint -> type check -> tests -> build -> Playwright -> coverage -> security checks.
# One job, ordered steps -> the order above is guaranteed by construction.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cdis
          MYSQL_USER: cdis
          MYSQL_PASSWORD: cdis_dev_password
          MYSQL_ROOT_PASSWORD: cdis_root_dev_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcdis_root_dev_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            front-end/package-lock.json
            deployment/package-lock.json

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      # generated/ is gitignored (it's a build artifact, not source) —
      # a fresh checkout has no Prisma Client until this runs. Needed
      # before type-check, tests, and the seed step below all import it.
      - name: Generate Prisma Client
        working-directory: back-end
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      # CI-only values, matching the *.env.example files. Not secrets —
      # the same test-only JWT secret already lives in
      # back-end/vitest.config.ts for the unit-test suite; the whole
      # database is thrown away at the end of the job either way.
      - name: Write backend .env
        working-directory: back-end
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=4000
          CORS_ORIGIN=http://localhost:5173
          DATABASE_URL=mysql://cdis:cdis_dev_password@localhost:3308/cdis
          JWT_ACCESS_SECRET=ci-only-secret-never-used-outside-github-actions
          JWT_ACCESS_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN_DAYS=7
          BCRYPT_SALT_ROUNDS=4
          ACCOUNT_LOCKOUT_MAX_ATTEMPTS=5
          ACCOUNT_LOCKOUT_DURATION_MINUTES=15
          TRUST_PROXY_HOPS=0
          ALLOW_SELF_REGISTRATION=true
          EOF

      # Real production value (a relative path, resolved against
      # whatever origin the browser loads the page from) — this is a
      # quality-gate build, not a served-and-tested-locally one (E2E
      # further down runs the fully containerized stack instead), so
      # it should build with the same value production actually uses.
      - name: Write frontend .env
        working-directory: front-end
        run: |
          cat > .env <<'EOF'
          VITE_APP_NAME=CDIS
          VITE_APP_ENV=production
          VITE_API_BASE_URL=/api/v1
          EOF

      # Only `cdis_test` is needed here — the backend's integration
      # tests (e.g. auth.integration.test.ts's admin-role flow) look up
      # seeded roles directly. The E2E stage further down runs its own
      # fully containerized MySQL via deployment/compose/compose.yaml,
      # so there's no need to also prep a "cdis" dev database on this
      # services: container.
      # The CREATE/GRANT mirrors deployment/compose/mysql-init/ (which
      # local dev gets automatically) — a services: container starts
      # before checkout, so it can't mount that script itself. Without
      # the GRANT the `cdis` user gets P1010 "access denied".
      # db:test:prepare is the exact command developers run locally.
      - name: Prepare test database
        working-directory: back-end
        run: |
          mysql -h127.0.0.1 -P3308 -uroot -pcdis_root_dev_password < ../deployment/compose/mysql-init/01-test-database.sql
          npm run db:test:prepare

      #  lint 
      - name: Lint backend
        working-directory: back-end
        run: npm run lint

      - name: Lint frontend
        working-directory: front-end
        run: npm run lint

      #  type check 
      - name: Type-check backend
        working-directory: back-end
        run: npm run build # back-end's "build" script *is* `tsc --noEmit` — see docs/standards/deployment.md

      - name: Type-check frontend
        working-directory: front-end
        run: npx tsc -b

      #  tests 
      - name: Backend tests (unit + integration)
        working-directory: back-end
        run: npm run test:all

      - name: Frontend tests
        working-directory: front-end
        run: npm run test

      #  build 
      - name: Build frontend
        working-directory: front-end
        run: npm run build

      #  Playwright (E2E)
      # Runs against the real containerized stack (deployment/compose/
      # compose.yaml — MySQL + backend + frontend + Apache reverse
      # proxy), not locally-started dev processes, so this exercises
      # the same routing/cookie/build-artifact path production uses.
      - name: Install deployment dependencies
        working-directory: deployment
        run: npm ci

      - name: Install Playwright browsers
        working-directory: deployment
        run: npx playwright install --with-deps chromium

      # CI-only values. compose.yaml builds from this checkout's own
      # back-end/ and front-end/ by default.
      - name: Write deployment compose .env
        working-directory: deployment/compose
        run: |
          cat > .env <<'EOF'
          PUBLIC_ORIGIN=http://localhost:8080
          DB_PASSWORD=ci-only-db-password
          DB_ROOT_PASSWORD=ci-only-db-root-password
          JWT_ACCESS_SECRET=ci-only-secret-never-used-outside-github-actions
          SEED_ADMIN_EMAIL=e2e-admin@example.com
          SEED_ADMIN_PASSWORD=e2e-admin-password
          EOF

      - name: Bring up the stack
        working-directory: deployment
        run: ./scripts/e2e-up.sh

      - name: Run E2E tests
        working-directory: deployment
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: deployment/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        working-directory: deployment/compose
        run: docker compose -f compose.yaml logs

      - name: Tear down the stack
        if: always()
        working-directory: deployment/compose
        run: docker compose -f compose.yaml down -v

      # coverage 
      # Re-runs with coverage instrumentation so a coverage-threshold
      # failure shows up as its own distinct, clearly-labeled stage
      # rather than being folded into the "tests" result above.
      - name: Backend coverage
        working-directory: back-end
        run: npm run test:coverage

      - name: Frontend coverage
        working-directory: front-end
        run: npm run test:coverage

      # security checks 
      - name: Audit backend dependencies
        working-directory: back-end
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: front-end
        run: npm audit --audit-level=high

      - name: Audit deployment (E2E tooling) dependencies
        working-directory: deployment
        run: npm audit --audit-level=high

  # Publishes both images only after every gate above has passed, and
  # only for main — so a published image is always one that was tested.
  # Image names derive from this repository, so a clone of this template
  # publishes to its *own* ghcr.io/<owner>/<repo>-{backend,frontend}
  # with no edits. Tagged by commit SHA (what deploy.sh pins) plus
  # `main` as a moving convenience tag — production never deploys it.
  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names
        id: images
        # GHCR requires lowercase; owner/repo names may not be.
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${base}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64: the target server's CPU architecture isn't fixed
      # (e.g. cloud ARM instances), so both ship as one multi-platform image.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: back-end
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: front-end
          push: true
          platforms: linux/amd64,linux/arm64
          # Real production values: the API is same-origin behind the
          # reverse proxy, so a relative base URL works for any domain.
          build-args: |
            VITE_APP_NAME=CDIS
            VITE_APP_ENV=production
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo ""
            echo "Set these in the server's compose/.env.production:"
            echo '```'
            echo "BACKEND_IMAGE=${{ steps.images.outputs.backend }}"
            echo "FRONTEND_IMAGE=${{ steps.images.outputs.frontend }}"
            echo '```'
            echo "Deploy this commit: \`./scripts/deploy.sh ${{ github.sha }} ${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
